name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Verificar que no hay scripts inline (CSP)
        run: |
          ! grep -Pzr '<script(?![^>]*src=)[^>]*>[^<]+</script>' index.html app.html