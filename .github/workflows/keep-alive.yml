name: Keep-alive Supabase

on:
  schedule:
    # Cada lunes a las 09:00 UTC, para evitar que el proyecto free tier
    # de Supabase se pause por inactividad (se pausa tras ~7 dias).
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ping a Supabase (keep-alive)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/keep-alive.mjs
